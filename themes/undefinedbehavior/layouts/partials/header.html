<header class="site-header">
  <div class="wrap site-header__inner">
    <a href="{{ "/" | relURL }}" class="prompt-logo">
      <span class="prompt-user">dan</span><span class="prompt-at">@</span><span class="prompt-host">undefinedbehavior</span><span class="prompt-colon">:~$</span>
      <span class="prompt-cursor" aria-hidden="true"></span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ "/posts/" | relURL }}"><span class="nav-cmd">ls</span> posts/</a>
      <a href="{{ "/projects/" | relURL }}"><span class="nav-cmd">ls</span> projects/</a>
      <a href="{{ "/tags/" | relURL }}"><span class="nav-cmd">grep</span> -r tags/</a>
      <a href="{{ "/about/" | relURL }}"><span class="nav-cmd">cat</span> about.md</a>
      {{ with .Site.Params.rss }}<a href="{{ "/index.xml" | relURL }}"><span class="nav-cmd">tail</span> -f feed</a>{{ end }}
    </nav>
  </div>
</header>
