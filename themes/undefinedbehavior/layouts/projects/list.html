{{ define "main" }}
<section class="wrap log-section">

  {{ with .Content }}<div class="list-intro">{{ . }}</div>{{ end }}
  <div class="diag-list">
    {{ range .Pages.ByDate.Reverse }}
      {{ partial "project-card.html" . }}
    {{ else }}
    <p class="tok-dim">// nothing here yet</p>
    {{ end }}
  </div>
</section>
{{ end }}
